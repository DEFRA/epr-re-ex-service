apiVersion: 1

datasources:
  - name: CloudWatch
    type: cloudwatch
    uid: cloudwatch
    isDefault: true
    jsonData:
      authType: keys
      defaultRegion: eu-west-2
      # The local emulator speaks the CloudWatch API, so panels built here use
      # the same queries as the deployed dashboard and their JSON transfers
      # unchanged. It does not implement Metrics Insights SQL, so build panels in
      # Metric Search mode -- pin the dimension per series rather than GROUP BY.
      endpoint: http://floci:4566
    secureJsonData:
      accessKey: test
      secretKey: test
