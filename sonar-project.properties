# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_epr-re-ex-service
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/epr-re-ex-service
sonar.links.ci=https://github.com/DEFRA/epr-re-ex-service/actions
sonar.links.scm=https://github.com/DEFRA/epr-re-ex-service
sonar.links.issue=https://eaflood.atlassian.net/jira/software/projects/PAE/summary

sonar.sources=lib/
sonar.exclusions=lib/**/*.test.js
sonar.tests=lib/
sonar.test.inclusions=lib/**/*.test.js

sonar.javascript.lcov.reportPaths=./coverage/lcov.info
sonar.coverage.exclusions=lib/index.js

# compose/emf-collector/Dockerfile has no USER directive by design: its
# entrypoint needs root to match the mounted Docker socket's host-specific
# group GID before dropping privileges to `node` at runtime (see
# docker-entrypoint.sh). Sonar's docker:S6471 rule only reads the static
# USER line and can't see that runtime drop, so it always flags this file.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=compose/emf-collector/Dockerfile
