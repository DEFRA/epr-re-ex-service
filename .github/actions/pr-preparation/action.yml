name: Preparation
description: 'Check branch name, add ticket link to PR description, and check for pinned dependencies'

outputs:
  skip:
    description: 'true when the PR is automated and branch conventions do not apply'
    value: ${{ steps.check-branch.outputs.skip }}

runs:
  using: 'composite'
  steps:
    - name: Check branch name
      id: check-branch
      shell: bash
      env:
        BRANCH: ${{ github.event.pull_request.head.ref }}
        ACTOR: ${{ github.actor }}
      run: node ${{ github.action_path }}/check-branch.mjs "$BRANCH" "$ACTOR"

    - name: Add ticket link to PR description
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      if: ${{ steps.check-branch.outputs.kind == 'jira' }}
      env:
        TICKET_KEY: ${{ steps.check-branch.outputs.key }}
      with:
        script: |
          const { pull_request, repository } = context.payload;
          const { body: previousBody } = pull_request;
          const { TICKET_KEY: ticketKey } = process.env;
          const ticketLink = `[${ticketKey}](https://eaflood.atlassian.net/browse/${ticketKey})`;

          if (!previousBody?.includes(ticketLink)) {
            github.rest.pulls.update({
              owner: repository.owner.login,
              repo: repository.name,
              pull_number: pull_request.number,
              body: `Ticket: ${ticketLink}\n${previousBody}`,
            });
          } else {
            console.log('PR description already contains a link to the ticket')
          }

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check for pinned dependencies
      shell: bash
      run: node ${{ github.action_path }}/check-pins.mjs package.json
